{% extends "base.html" %}

{% block title %}Редактировать голосование - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Редактировать голосование</h1>
</div>

<form method="POST" action="{{ url_for('admin_vote_edit', vote_id=vote.id) }}" class="form-standard">
    <div class="form-group">
        <label for="title">Название *</label>
        <input type="text" id="title" name="title" class="form-control" value="{{ vote.title }}" required>
    </div>

    <div class="form-group">
        <label for="description">Описание</label>
        <textarea id="description" name="description" class="form-control" rows="5">{{ vote.description or '' }}</textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="start_datetime">Начало голосования *</label>
            <input type="datetime-local" id="start_datetime" name="start_datetime" class="form-control"
                   value="{{ vote.start_datetime.strftime('%Y-%m-%dT%H:%M') }}" required>
        </div>
        <div class="form-group">
            <label for="end_datetime">Окончание голосования *</label>
            <input type="datetime-local" id="end_datetime" name="end_datetime" class="form-control"
                   value="{{ vote.end_datetime.strftime('%Y-%m-%dT%H:%M') }}" required>
        </div>
    </div>

    <div class="form-group">
        <label for="status">Статус</label>
        <select id="status" name="status" class="form-control">
            <option value="draft" {% if vote.status == 'draft' %}selected{% endif %}>Черновик</option>
            <option value="active" {% if vote.status == 'active' %}selected{% endif %}>Активно</option>
            <option value="completed" {% if vote.status == 'completed' %}selected{% endif %}>Завершено</option>
            <option value="cancelled" {% if vote.status == 'cancelled' %}selected{% endif %}>Отменено</option>
        </select>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="is_anonymous" {% if vote.is_anonymous %}checked{% endif %}>
            Анонимное голосование
        </label>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="is_public" {% if vote.is_public %}checked{% endif %}>
            Результаты публичны
        </label>
    </div>

    <div class="alert alert-info">
        <strong>Примечание:</strong> Редактирование вариантов ответов здесь не поддерживается.
        Для изменения вариантов создайте новое голосование.
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('vote_detail', vote_id=vote.id) }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
