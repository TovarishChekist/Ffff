{% extends "base.html" %}

{% block title %}Редактировать новость - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Редактировать новость</h1>
</div>

<form method="POST" action="{{ url_for('admin_news_edit', news_id=news.id) }}" class="form-standard">
    <div class="form-group">
        <label for="title">Заголовок *</label>
        <input type="text" id="title" name="title" class="form-control" value="{{ news.title }}" required>
    </div>

    <div class="form-group">
        <label for="summary">Краткое описание</label>
        <textarea id="summary" name="summary" class="form-control" rows="3">{{ news.summary or '' }}</textarea>
        <small class="form-text">Отображается в списке новостей</small>
    </div>

    <div class="form-group">
        <label for="content">Содержание *</label>
        <textarea id="content" name="content" class="form-control" rows="10" required>{{ news.content }}</textarea>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="is_important" {% if news.is_important %}checked{% endif %}>
            Важная новость (отображается особым образом)
        </label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('news_detail', news_id=news.id) }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
