{% extends "base.html" %}

{% block title %}Редактировать проект - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Редактировать проект</h1>
</div>

<form method="POST" action="{{ url_for('admin_project_edit', project_id=project.id) }}" class="form-standard">
    <div class="form-group">
        <label for="title">Название *</label>
        <input type="text" id="title" name="title" class="form-control" value="{{ project.title }}" required>
    </div>

    <div class="form-group">
        <label for="description">Описание *</label>
        <textarea id="description" name="description" class="form-control" rows="6" required>{{ project.description }}</textarea>
    </div>

    <div class="form-group">
        <label for="status">Статус *</label>
        <select id="status" name="status" class="form-control" required>
            <option value="planning" {% if project.status == 'planning' %}selected{% endif %}>Планирование</option>
            <option value="active" {% if project.status == 'active' %}selected{% endif %}>Активен</option>
            <option value="on_hold" {% if project.status == 'on_hold' %}selected{% endif %}>Приостановлен</option>
            <option value="completed" {% if project.status == 'completed' %}selected{% endif %}>Завершен</option>
            <option value="cancelled" {% if project.status == 'cancelled' %}selected{% endif %}>Отменен</option>
        </select>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="start_date">Дата начала</label>
            <input type="date" id="start_date" name="start_date" class="form-control"
                   value="{{ project.start_date.strftime('%Y-%m-%d') if project.start_date else '' }}">
        </div>
        <div class="form-group">
            <label for="end_date">Дата окончания</label>
            <input type="date" id="end_date" name="end_date" class="form-control"
                   value="{{ project.end_date.strftime('%Y-%m-%d') if project.end_date else '' }}">
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('project_detail', project_id=project.id) }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
