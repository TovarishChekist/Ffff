{% extends "base.html" %}

{% block title %}Редактировать пользователя - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Редактировать пользователя</h1>
</div>

<form method="POST" action="{{ url_for('admin_user_edit', user_id=user.id) }}" class="form-standard">
    <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="last_name">Фамилия *</label>
            <input type="text" id="last_name" name="last_name" class="form-control" value="{{ user.last_name }}" required>
        </div>
        <div class="form-group">
            <label for="first_name">Имя *</label>
            <input type="text" id="first_name" name="first_name" class="form-control" value="{{ user.first_name }}" required>
        </div>
    </div>

    <div class="form-group">
        <label for="patronymic">Отчество</label>
        <input type="text" id="patronymic" name="patronymic" class="form-control" value="{{ user.patronymic or '' }}">
    </div>

    <div class="form-group">
        <label for="role">Роль *</label>
        <select id="role" name="role" class="form-control" required>
            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Администратор</option>
            <option value="chairman" {% if user.role == 'chairman' %}selected{% endif %}>Председатель</option>
            <option value="secretary" {% if user.role == 'secretary' %}selected{% endif %}>Секретарь</option>
            <option value="member" {% if user.role == 'member' %}selected{% endif %}>Член совета</option>
            <option value="observer" {% if user.role == 'observer' %}selected{% endif %}>Наблюдатель</option>
        </select>
    </div>

    <div class="form-group">
        <label for="department">Отдел</label>
        <select id="department" name="department" class="form-control">
            <option value="">Не указан</option>
            {% for dept_key, dept_name in departments.items() %}
                <option value="{{ dept_key }}" {% if user.department == dept_key %}selected{% endif %}>{{ dept_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="is_active" {% if user.is_active %}checked{% endif %}>
            Аккаунт активен
        </label>
    </div>

    <div class="form-group">
        <label for="new_password">Новый пароль</label>
        <input type="password" id="new_password" name="new_password" class="form-control">
        <small class="form-text">Оставьте пустым, если не хотите менять пароль</small>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
