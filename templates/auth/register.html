{% extends "base.html" %}

{% block title %}Регистрация - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>Регистрация</h1>
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" name="password" class="form-control" minlength="6" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="last_name">Фамилия *</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="first_name">Имя *</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" required>
                </div>
            </div>
            <div class="form-group">
                <label for="patronymic">Отчество</label>
                <input type="text" id="patronymic" name="patronymic" class="form-control">
            </div>
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+7 (XXX) XXX-XX-XX">
            </div>
            <div class="form-group">
                <label for="department">Отдел</label>
                <select id="department" name="department" class="form-control">
                    <option value="">Не указан</option>
                    {% for dept_key, dept_name in departments.items() %}
                        <option value="{{ dept_key }}">{{ dept_name }}</option>
                    {% endfor %}
                </select>
                <small class="form-text">Укажите отдел, в котором вы хотите работать</small>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
        <div class="auth-links">
            <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
