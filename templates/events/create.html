{% extends "base.html" %}

{% block title %}Создать мероприятие - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Создать мероприятие</h1>
</div>

<form method="POST" action="{{ url_for('event_create') }}" class="form-standard">
    <div class="form-group">
        <label for="title">Название *</label>
        <input type="text" id="title" name="title" class="form-control" required>
    </div>

    <div class="form-group">
        <label for="description">Описание</label>
        <textarea id="description" name="description" class="form-control" rows="5"></textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="start_datetime">Начало *</label>
            <input type="datetime-local" id="start_datetime" name="start_datetime" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="end_datetime">Окончание</label>
            <input type="datetime-local" id="end_datetime" name="end_datetime" class="form-control">
        </div>
    </div>

    <div class="form-group">
        <label for="event_type">Тип мероприятия *</label>
        <select id="event_type" name="event_type" class="form-control" required>
            <option value="meeting">Заседание</option>
            <option value="conference">Конференция</option>
            <option value="training">Тренинг</option>
            <option value="social">Общественное мероприятие</option>
            <option value="other">Другое</option>
        </select>
    </div>

    <div class="form-group">
        <label for="location">Место проведения</label>
        <input type="text" id="location" name="location" class="form-control" placeholder="Адрес или название места">
    </div>

    <div class="form-group">
        <label for="online_link">Ссылка на онлайн-трансляцию</label>
        <input type="url" id="online_link" name="online_link" class="form-control" placeholder="https://...">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Создать</button>
        <a href="{{ url_for('events_list') }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
