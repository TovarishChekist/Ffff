{% extends "base.html" %}

{% block title %}Редактировать профиль - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Редактировать профиль</h1>
</div>

<form method="POST" action="{{ url_for('profile_edit') }}" class="form-standard">
    <div class="form-row">
        <div class="form-group">
            <label for="last_name">Фамилия *</label>
            <input type="text" id="last_name" name="last_name" class="form-control" value="{{ current_user.last_name }}" required>
        </div>
        <div class="form-group">
            <label for="first_name">Имя *</label>
            <input type="text" id="first_name" name="first_name" class="form-control" value="{{ current_user.first_name }}" required>
        </div>
    </div>

    <div class="form-group">
        <label for="patronymic">Отчество</label>
        <input type="text" id="patronymic" name="patronymic" class="form-control" value="{{ current_user.patronymic or '' }}">
    </div>

    <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
    </div>

    <div class="form-group">
        <label for="department">Отдел</label>
        <select id="department" name="department" class="form-control">
            <option value="" {% if not current_user.department %}selected{% endif %}>Не указан</option>
            {% for dept_key, dept_name in departments.items() %}
                <option value="{{ dept_key }}" {% if current_user.department == dept_key %}selected{% endif %}>{{ dept_name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="bio">О себе</label>
        <textarea id="bio" name="bio" class="form-control" rows="5">{{ current_user.bio or '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('profile') }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
