{% extends "base.html" %}

{% block title %}Загрузить документ - {{ org_short_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Загрузить документ</h1>
</div>

<form method="POST" action="{{ url_for('document_upload') }}" enctype="multipart/form-data" class="form-standard">
    <div class="form-group">
        <label for="title">Название документа *</label>
        <input type="text" id="title" name="title" class="form-control" required>
    </div>

    <div class="form-group">
        <label for="description">Описание</label>
        <textarea id="description" name="description" class="form-control" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label for="category">Категория</label>
        <select id="category" name="category" class="form-control">
            <option value="protocol">Протокол</option>
            <option value="report">Отчет</option>
            <option value="presentation">Презентация</option>
            <option value="photo">Фотография</option>
            <option value="other">Другое</option>
        </select>
    </div>

    <div class="form-group">
        <label for="file">Файл *</label>
        <input type="file" id="file" name="file" class="form-control" required>
        <small class="form-text">Максимальный размер файла: 16 МБ. Допустимые форматы: txt, pdf, doc, docx, xls, xlsx, jpg, jpeg, png, gif</small>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Загрузить</button>
        <a href="{{ url_for('documents_list') }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
